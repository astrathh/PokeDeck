# Publica o instalador do PokeDeck nas Releases do GitHub quando uma tag de versão é enviada:
#   npm version patch        (0.1.3 → 0.1.4, cria o commit e a tag v0.1.4)
#   git push --follow-tags
# O PokeDeck instalado procura versão nova nessas Releases e se atualiza sozinho.
#
# A Release nasce como RASCUNHO (invisível para quem usa): o electron-builder sobe o instalador e o
# latest.yml, o fluxo confere e escreve a descrição, e só no último passo ela é publicada. Assim nunca
# sai uma Release pela metade (sem .exe), e funciona também com "releases imutáveis" ligado no GitHub.
#
# Três etapas, em sequência:
#   windows → testa, monta o .exe e CRIA o rascunho
#   linux   → monta os AppImages ARM64 e x64 (VMs na nuvem), cada um na máquina nativa, e sobe no MESMO
#             rascunho (roda depois do windows para não haver jobs criando rascunhos ao mesmo tempo)
#   publicar → confere os arquivos das duas plataformas, escreve a descrição e publica
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # criar a Release e subir o instalador

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Conferir tipos e testes
        run: |
          npm run typecheck
          npm test

      - name: Montar o instalador e subir num rascunho de Release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    needs: windows
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Montar o AppImage ${{ matrix.arch }} e subir no rascunho
        run: npm run release:linux-${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publicar:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # histórico e tags, para a descrição da Release

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Conferir que o rascunho tem os instaladores
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$assets"
          echo "$assets" | grep -q '^latest.yml$'
          echo "$assets" | grep -q '\.exe$'
          echo "$assets" | grep -q '^latest-linux-arm64.yml$'
          echo "$assets" | grep -q '^PokeDeck-linux-arm64.AppImage$'
          echo "$assets" | grep -q '^latest-linux.yml$'
          echo "$assets" | grep -q '^PokeDeck-linux-x86_64.AppImage$'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escrever a descrição (commits desde a última Release publicada)
        run: |
          anterior=$(gh release list --exclude-drafts --limit 30 --json tagName             --jq '[.[] | select(.tagName != env.GITHUB_REF_NAME)][0].tagName // ""')
          echo "descrição: commits de '${anterior:-início}' até $GITHUB_REF_NAME"
          node scripts/release-notes.mjs "$anterior" "$GITHUB_REF_NAME" > notas.md
          cat notas.md
          gh release edit "$GITHUB_REF_NAME" --title "PokeDeck ${GITHUB_REF_NAME#v}" --notes-file notas.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a Release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
