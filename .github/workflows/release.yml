# Publica o instalador do Deck nas Releases do GitHub quando uma tag de versão é enviada:
#   npm version patch        (0.1.0 → 0.1.1, cria o commit e a tag v0.1.1)
#   git push --follow-tags
# O Deck instalado dos amigos procura versão nova nessas Releases e se atualiza sozinho.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # criar a Release e subir o instalador

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Conferir tipos e testes da automação
        run: |
          npm run typecheck
          npm run test:auto

      - name: Montar e publicar o instalador
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
